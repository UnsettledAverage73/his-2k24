name: CIS Benchmark Security Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    name: Run Compliance Engine & Safety Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v tests/

      - name: Verify CLI Simulation (Dry Run)
        run: |
          python3 cis_audit.py --os rhel9 --category access_control --dry-run
          python3 cis_audit.py --os rhel9 --category access_control --mode remediate --dry-run
